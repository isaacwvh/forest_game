name: iOS frontend
on:
  push:
    paths: ['frontend/**', 'assets/**', 'spec_examples/placement-cases.json', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', 'assets/**', 'spec_examples/placement-cases.json', '.github/workflows/frontend.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Record Xcode version
        run: xcodebuild -version
      - name: Validate, test Debug, build Release
        run: |
          set -euo pipefail
          {
            python3 frontend/scripts/generate_project.py --check
            bash frontend/scripts/test-mac.sh
          } 2>&1 | tee ios-validation.log
      - name: Summarize validation failure
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          log = Path("ios-validation.log")
          if log.exists():
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write("### iOS validation failure\n\n```text\n")
                  summary.write("\n".join(log.read_text(errors="replace").splitlines()[-120:]))
                  summary.write("\n```\n")
          PY
      - name: Retain native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: frontend/DerivedData/Logs/Test/*.xcresult
          if-no-files-found: ignore
