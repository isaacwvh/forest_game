name: iOS frontend
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        run: python tools/ci_changes.py
  simulator:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Record Xcode version
        run: xcodebuild -version
      - name: Verify canonical catalogue bytes
        run: python3 tools/check_catalog_bytes.py
      - name: Validate, test Debug, build Release
        run: |
          set -euo pipefail
          {
            python3 frontend/scripts/generate_project.py --check
            bash frontend/scripts/test-mac.sh
          } 2>&1 | tee ios-validation.log
      - name: Summarize validation failure
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          log = Path("ios-validation.log")
          if log.exists():
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write("### iOS validation failure\n\n```text\n")
                  summary.write("\n".join(log.read_text(errors="replace").splitlines()[-120:]))
                  summary.write("\n```\n")
          PY
      - name: Retain native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: frontend/DerivedData/Logs/Test/*.xcresult
          if-no-files-found: ignore
      - name: Retain validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-validation-log
          path: ios-validation.log
          if-no-files-found: ignore
  frontend-gate:
    name: Frontend gate
    if: always()
    needs: [changes, simulator]
    runs-on: ubuntu-latest
    steps:
      - name: Require applicable validation to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs.frontend }}
          RESULT: ${{ needs.simulator.result }}
        run: |
          test "$CHANGES" = success
          if [ "$REQUIRED" = true ]; then test "$RESULT" = success; else test "$RESULT" = skipped; fi
