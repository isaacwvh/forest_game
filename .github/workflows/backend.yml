name: Backend
on:
  push:
    paths: ['backend/**', 'assets/**', 'spec_examples/*.json', 'frontend/MovementForest/Resources/Fixtures/*.json', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'assets/**', 'spec_examples/*.json', 'frontend/MovementForest/Resources/Fixtures/*.json', '.github/workflows/backend.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: forest
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forest -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      FOREST_TEST_DATABASE_URL: postgresql+psycopg://forest:ci-only-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install locked dependencies and application
        run: |
          python -m pip install -r backend/requirements.lock
          python -m pip install --no-deps -e backend
          python -m pip check
      - name: Lint and format
        run: |
          ruff check backend
          ruff format --check backend
      - name: PostgreSQL migrations, ownership and concurrency
        run: python -m pytest backend/tests -q 2>&1 | tee backend-tests.log
      - name: Summarize test failure
        if: failure()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          log = Path("backend-tests.log")
          if log.exists():
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write("### Backend test failure\n\n```text\n")
                  summary.write("\n".join(log.read_text(errors="replace").splitlines()[-120:]))
                  summary.write("\n```\n")
          PY
      - name: Activity, skills and scheduled-visitor HTTP walkthroughs
        run: |
          python backend/scripts/smoke_activity.py
          python backend/scripts/smoke_skills.py
          python backend/scripts/smoke_launch.py
      - name: Visitor HTTP walkthrough and pacing model
        run: |
          python backend/scripts/smoke_visitors.py
          python backend/scripts/simulate_visitors.py
      - name: Build application image
        run: docker build -t movement-forest-api:ci backend
