name: Backend
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        run: python tools/ci_changes.py
  postgres:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: forest
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forest -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      FOREST_TEST_DATABASE_URL: postgresql+psycopg://forest:ci-only-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install locked dependencies and application
        run: |
          python -m pip install -r backend/requirements.lock
          python -m pip install --no-deps -e backend
          python -m pip check
      - name: Lint and format
        run: |
          ruff check backend
          ruff format --check backend
      - name: Verify canonical catalogue bytes
        run: python tools/check_catalog_bytes.py
      - name: PostgreSQL migrations, ownership and concurrency
        run: |
          set -euo pipefail
          python -m pytest backend/tests -q --junitxml=backend-results.xml 2>&1 | tee backend-tests.log
      - name: Activity, skills and scheduled-visitor HTTP walkthroughs
        run: |
          set -euo pipefail
          {
            python backend/scripts/smoke_activity.py
            python backend/scripts/smoke_skills.py
            python backend/scripts/smoke_launch.py
          } 2>&1 | tee activity-smoke.log
      - name: Visitor HTTP walkthrough and pacing model
        run: |
          set -euo pipefail
          {
            python backend/scripts/smoke_visitors.py
            python backend/scripts/simulate_visitors.py
          } 2>&1 | tee visitor-smoke.log
      - name: Build application image
        run: docker build --build-arg FOREST_RELEASE_COMMIT=${{ github.sha }} -t movement-forest-api:ci backend
      - name: Exercise built API, worker, migration and maintenance
        run: python backend/scripts/smoke_image.py --image movement-forest-api:ci
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-validation
          path: |
            backend-results.xml
            backend-tests.log
            activity-smoke.log
            visitor-smoke.log
          if-no-files-found: ignore
      - name: Summarize validation failure
        if: failure()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              for name in ("backend-tests.log", "activity-smoke.log", "visitor-smoke.log"):
                  log = Path(name)
                  if log.exists():
                      summary.write(f"### {name}\n\n```text\n")
                      summary.write("\n".join(log.read_text(errors="replace").splitlines()[-120:]))
                      summary.write("\n```\n")
          PY
  backend-gate:
    name: Backend gate
    if: always()
    needs: [changes, postgres]
    runs-on: ubuntu-latest
    steps:
      - name: Require applicable validation to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs.backend }}
          RESULT: ${{ needs.postgres.result }}
        run: |
          test "$CHANGES" = success
          if [ "$REQUIRED" = true ]; then test "$RESULT" = success; else test "$RESULT" = skipped; fi
