name: movement-forest
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: forest
      POSTGRES_PASSWORD: forest-local-only
      POSTGRES_DB: forest
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - forest-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forest -d forest"]
      interval: 2s
      timeout: 3s
      retries: 30
  adminer:
    image: adminer:6.1.2-standalone
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
  migrate:
    build: .
    environment:
      FOREST_DATABASE_URL: postgresql+psycopg://forest:forest-local-only@db:5432/forest
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]
  api:
    build: .
    environment:
      FOREST_ENVIRONMENT: ${FOREST_ENVIRONMENT:-local}
      FOREST_DATABASE_URL: postgresql+psycopg://forest:forest-local-only@db:5432/forest
      FOREST_AUTH_MODE: ${FOREST_AUTH_MODE:-development}
      FOREST_DEV_AUTH_SECRET: ${FOREST_DEV_AUTH_SECRET:-}
      FOREST_AUTH_ISSUER: ${FOREST_AUTH_ISSUER:-}
      FOREST_AUTH_AUDIENCE: ${FOREST_AUTH_AUDIENCE:-}
      FOREST_AUTH_JWKS_URL: ${FOREST_AUTH_JWKS_URL:-}
      FOREST_AUTH_ALGORITHM: ${FOREST_AUTH_ALGORITHM:-RS256}
      FOREST_OPERATION_METRICS_ENABLED: ${FOREST_OPERATION_METRICS_ENABLED:-false}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).close()"
      interval: 2s
      timeout: 3s
      start_period: 5s
      retries: 30
    depends_on:
      db:
        condition: service_healthy
volumes:
  forest-db:
